<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Autoforum — Panel administracyjny</title>
  <style>
    /* ============================================================
       PALETTE — two themes, premium feel
       Dark = "Mercedes Night"   (deep black + warm gold)
       Light = "Maybach Atelier" (cream paper + bronze)
       ============================================================ */
    :root[data-theme="dark"] {
      --bg:        #0c0d10;
      --panel:     #15171d;
      --panel-2:   #1c1f27;
      --panel-3:   #232732;
      --border:    #2a2e38;
      --border-2:  #353a47;
      --text:      #f3efe6;
      --text-soft: #c4bfb1;
      --muted:     #7c7d85;
      --muted-2:   #5a5d68;
      --accent:    #c8a26b;   /* warm gold */
      --accent-2:  #d8b481;
      --accent-on: #1a1408;
      --ok:        #8fc89a;
      --err:       #e07a7a;
      --warn:      #e8c270;
      --shadow:    0 12px 40px rgba(0,0,0,0.55);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.35);
    }
    :root[data-theme="light"] {
      --bg:        #ece5d6;   /* paper cream */
      --panel:     #f7f1e3;
      --panel-2:   #ebe2cb;
      --panel-3:   #ddd0b1;
      --border:    #cfc1a3;
      --border-2:  #bfaf8c;
      --text:      #1a1612;
      --text-soft: #3d342a;
      --muted:     #6e6049;
      --muted-2:   #948464;
      --accent:    #8b6f3f;   /* bronze */
      --accent-2:  #a08349;
      --accent-on: #fff8ea;
      --ok:        #4e7a3b;
      --err:       #a14040;
      --warn:      #b07c1a;
      --shadow:    0 18px 50px rgba(60,40,15,0.12);
      --shadow-sm: 0 2px 6px rgba(60,40,15,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Inter', system-ui, sans-serif;
      font-size: 14.5px;
      line-height: 1.55;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    a  { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-2); }

    /* ============================================================
       Form controls
       ============================================================ */
    input, textarea, select {
      font: inherit;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      width: 100%;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }
    input:hover, textarea:hover, select:hover { border-color: var(--border-2); }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200, 162, 107, 0.18);
    }
    textarea { resize: vertical; min-height: 86px; line-height: 1.5; }

    button { font: inherit; cursor: pointer; transition: all 0.18s ease; }

    .btn-primary {
      padding: 10px 18px;
      background: var(--accent);
      color: var(--accent-on);
      border: 1px solid var(--accent);
      border-radius: 8px;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .btn-primary:active { transform: translateY(0); }

    .btn-ghost {
      padding: 10px 18px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 500;
      white-space: nowrap;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .btn-danger {
      padding: 6px 12px;
      background: transparent;
      color: var(--text-soft);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.84rem;
    }
    .btn-danger:hover { border-color: var(--err); color: var(--err); }

    /* ============================================================
       Login
       ============================================================ */
    #login { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    #login form {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.4rem 2.2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
    }
    #login h1 {
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }
    #login .sub { color: var(--muted); margin-bottom: 1.8rem; font-size: 0.86rem; }
    #login .field { margin-bottom: 1.1rem; }
    #login label {
      display: block;
      margin-bottom: 0.45rem;
      font-size: 0.74rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    #login button[type=submit] {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: var(--accent-on);
      border: 1px solid var(--accent);
      border-radius: 8px;
      font-weight: 500;
      margin-top: 0.5rem;
      letter-spacing: 0.04em;
    }
    #login button[type=submit]:hover { background: var(--accent-2); border-color: var(--accent-2); }
    #login .hint {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 1.2rem;
      line-height: 1.55;
      text-align: center;
    }
    #login .err { color: var(--err); margin-top: 0.8rem; font-size: 0.86rem; min-height: 1.2em; }

    /* ============================================================
       App layout
       ============================================================ */
    #app {
      display: none;
      min-height: 100vh;
      grid-template-columns: 270px 1fr;
      grid-template-rows: 64px 1fr;
      grid-template-areas: "topbar topbar" "sidebar main";
    }
    #app.ready { display: grid; }

    .topbar {
      grid-area: topbar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.6rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-size: 0.84rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-soft);
    }
    .brand b { color: var(--accent); font-weight: 500; letter-spacing: 0.06em; }
    .topbar-right { display: flex; align-items: center; gap: 0.7rem; }
    .topbar-right .user { color: var(--muted); font-size: 0.82rem; }
    .theme-switch {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.82rem;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }
    .theme-switch:hover { border-color: var(--accent); color: var(--accent); }
    .theme-switch .icon { width: 14px; height: 14px; }

    /* ============================================================
       Sidebar
       ============================================================ */
    .sidebar {
      grid-area: sidebar;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.4rem 0.75rem;
      overflow-y: auto;
    }
    .sidebar h4 {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted-2);
      padding: 0.5rem 0.95rem;
      margin-top: 1.1rem;
      font-weight: 500;
    }
    .sidebar h4:first-child { margin-top: 0; }
    .sidebar .tab {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text-soft);
      padding: 0.65rem 0.95rem;
      border-radius: 8px;
      font-size: 0.92rem;
      letter-spacing: 0.01em;
      margin-bottom: 2px;
    }
    .sidebar .tab:hover { background: var(--panel-2); color: var(--text); }
    .sidebar .tab.active {
      background: var(--accent);
      color: var(--accent-on);
      font-weight: 500;
    }

    /* ============================================================
       Main content
       ============================================================ */
    .main {
      grid-area: main;
      overflow-y: auto;
      padding: 2.4rem 3rem 5rem;
    }
    .page-head h2 {
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 0.3rem;
    }
    .page-head .desc {
      color: var(--muted);
      font-size: 0.92rem;
      max-width: 640px;
    }
    .page-head-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.4rem;
      margin-bottom: 2.2rem;
    }
    .page-head-row > div { min-width: 0; }
    .preview-link { flex-shrink: 0; }
    @media (max-width: 560px) {
      .page-head-row { flex-direction: column; gap: 0.9rem; }
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.6rem 1.8rem;
      margin-bottom: 1.6rem;
      box-shadow: var(--shadow-sm);
    }
    .section > h3 {
      font-size: 0.78rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }
    .section > .help {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 1.4rem;
      line-height: 1.55;
      max-width: 720px;
    }

    /* Subsection (group of strings) */
    .subgroup {
      margin-top: 1.4rem;
      padding-top: 1.4rem;
      border-top: 1px dashed var(--border);
    }
    .subgroup:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
    .subgroup-head h4 {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      margin-bottom: 0.2rem;
      color: var(--text);
    }
    .subgroup-head .desc {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.9rem;
      max-width: 620px;
      line-height: 1.55;
    }

    /* Field row */
    .field-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      padding: 0.85rem 0;
      border-bottom: 1px dashed var(--border);
    }
    .field-row:last-child { border-bottom: none; }
    .field-row .label-text {
      display: block;
      font-size: 0.74rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.1rem;
    }
    .field-row .label-key {
      display: block;
      font-size: 0.68rem;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      color: var(--muted-2);
      margin-bottom: 0.45rem;
    }
    .field-row .ctrl { display: flex; gap: 0.6rem; align-items: center; }
    .field-row .save-state {
      font-size: 0.76rem;
      color: var(--muted);
      min-width: 90px;
      text-align: right;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .field-row .save-state.ok  { color: var(--ok); }
    .field-row .save-state.err { color: var(--err); }

    /* Media row — flex, no overflow */
    .media-row {
      display: flex;
      gap: 1.1rem;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px dashed var(--border);
    }
    .media-row:last-child { border-bottom: none; }
    .media-thumb {
      flex: 0 0 110px;
      width: 110px;
      height: 76px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .media-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .media-thumb .empty { color: var(--muted-2); font-size: 0.74rem; }
    .media-info { flex: 1 1 auto; min-width: 0; }
    .media-info .label-text {
      font-size: 0.74rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.2rem;
    }
    .media-info .name { font-size: 0.96rem; font-weight: 500; margin-bottom: 0.3rem; color: var(--text); }
    .media-info .url {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.72rem;
      color: var(--muted-2);
      word-break: break-all;
      line-height: 1.5;
    }
    .media-row .right {
      flex: 0 0 auto;
      display: flex;
      gap: 0.6rem;
      align-items: center;
      white-space: nowrap;
    }
    .media-row .save-state { font-size: 0.76rem; color: var(--muted); min-width: 100px; text-align: right; }
    .media-row .save-state.ok  { color: var(--ok); }
    .media-row .save-state.err { color: var(--err); }

    /* Region (block list) */
    .region {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem 1.3rem;
      margin-bottom: 1rem;
    }
    .region-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      gap: 1rem;
    }
    .region-head h4 { font-size: 0.98rem; font-weight: 500; margin-bottom: 0.15rem; letter-spacing: 0.01em; }
    .region-head .desc { font-size: 0.8rem; color: var(--muted); line-height: 1.5; max-width: 460px; }
    .block-card {
      display: grid;
      grid-template-columns: 60px 1fr auto auto auto;
      gap: 0.7rem;
      align-items: center;
      padding: 0.75rem 0.9rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.55rem;
    }
    .block-card:hover { border-color: var(--border-2); }
    .block-card .order input { padding: 5px 7px; text-align: center; font-size: 0.84rem; }
    .block-card .summary { font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .block-card .summary .type-chip {
      display: inline-block;
      background: var(--panel-3);
      color: var(--accent);
      font-size: 0.66rem;
      padding: 3px 9px;
      border-radius: 4px;
      margin-right: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      vertical-align: 1px;
    }
    .visible-toggle {
      padding: 5px 11px;
      background: var(--panel-3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      font-size: 0.76rem;
    }
    .visible-toggle.hidden { color: var(--muted-2); opacity: 0.7; }
    .visible-toggle:hover { border-color: var(--accent); }
    .edit-btn {
      padding: 5px 11px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 5px;
      font-size: 0.76rem;
    }
    .edit-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ============================================================
       Modal
       ============================================================ */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 2rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
    }
    .modal-head {
      padding: 1.4rem 1.8rem 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    .modal-head h3 { font-size: 0.78rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 0.25rem; }
    .modal-head .title-row { font-size: 1.25rem; font-weight: 400; letter-spacing: -0.01em; color: var(--text); margin-bottom: 0.3rem; }
    .modal-head .desc { color: var(--muted); font-size: 0.86rem; line-height: 1.55; }
    .modal-head button.close { background: transparent; border: none; color: var(--muted); font-size: 1.6rem; padding: 0; line-height: 1; cursor: pointer; }
    .modal-head button.close:hover { color: var(--err); }
    .modal-body { padding: 1.5rem 1.8rem; }
    .modal-foot { padding: 1.1rem 1.8rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.6rem; }

    .modal-field { margin-bottom: 1.2rem; }
    .modal-field label {
      display: block;
      font-size: 0.74rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .modal-field small.hint {
      display: block;
      color: var(--muted-2);
      font-size: 0.78rem;
      margin-top: 0.35rem;
      line-height: 1.5;
    }
    .modal-field .upload-img { display: flex; gap: 0.7rem; align-items: center; }
    .modal-field .upload-img .preview {
      width: 70px;
      height: 50px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      flex: 0 0 70px;
    }
    .modal-field .upload-img .preview img { width: 100%; height: 100%; object-fit: cover; }

    .type-picker { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.7rem; }
    .type-picker button {
      padding: 1rem 1.1rem;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
    }
    .type-picker button:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .type-picker button b { display: block; font-size: 0.98rem; font-weight: 500; margin-bottom: 0.3rem; letter-spacing: 0.01em; }
    .type-picker button span { color: var(--muted); font-size: 0.8rem; line-height: 1.5; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.8rem;
      right: 1.8rem;
      padding: 0.9rem 1.3rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      box-shadow: var(--shadow);
      font-size: 0.9rem;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999;
      max-width: 400px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok  { border-left-color: var(--ok); }
    .toast.err { border-left-color: var(--err); }

    .empty-state { color: var(--muted); font-style: italic; font-size: 0.86rem; padding: 0.4rem 0 0.2rem; }

    /* Responsive */
    @media (max-width: 880px) {
      #app { grid-template-columns: 1fr; grid-template-rows: 64px auto 1fr; grid-template-areas: "topbar" "sidebar" "main"; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); padding: 0.7rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
      .sidebar h4 { display: none; }
      .sidebar .tab { width: auto; padding: 0.5rem 0.9rem; font-size: 0.86rem; margin-bottom: 0; }
      .main { padding: 1.4rem; }
      .block-card { grid-template-columns: 50px 1fr; gap: 0.5rem; }
      .block-card .visible-toggle, .block-card .edit-btn { grid-column: span 1; }
      .type-picker { grid-template-columns: 1fr; }
    }

    /* ============ Zgłoszenia (leads) ============ */
    .leads-badge {
      display: inline-block;
      min-width: 20px;
      padding: 0 6px;
      margin-left: 6px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-on);
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 20px;
      text-align: center;
      vertical-align: middle;
    }
    .sidebar .tab.active .leads-badge { background: var(--accent-on); color: var(--accent); }
    .leads-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .leads-toolbar input[type=search] { flex: 1 1 220px; max-width: 360px; }
    .leads-toolbar .spacer { flex: 1; }
    .leads-chip {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text-soft);
      border-radius: 999px;
      padding: 0.38rem 0.85rem;
      font-size: 0.8rem;
      letter-spacing: 0.02em;
    }
    .leads-chip:hover { border-color: var(--accent); color: var(--accent); }
    .leads-chip.active { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
    .leads-stats { display: flex; gap: 1.6rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
    .leads-stat { font-size: 0.82rem; color: var(--muted); }
    .leads-stat b { display: block; font-size: 1.5rem; color: var(--text); font-weight: 500; line-height: 1.1; }
    .leads-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    .leads-table th {
      text-align: left;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.5rem 0.6rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .leads-table td.nowrap { white-space: nowrap; }

      padding: 0.14rem 0.5rem;

      border-radius: 4px;

      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-soft);
    }
    .lead-brand--maybach { border-color: var(--accent); color: var(--accent); }

    .lead-detail .consent-row .mark { flex: 0 0 18px; font-weight: 600; }
    .lead-detail .consent-row .mark.no { color: var(--muted); }
    .lead-detail .consent-row .wording { color: var(--text-soft); line-height: 1.45; }
    .lead-detail textarea { width: 100%; min-height: 90px; margin-top: 0.4rem; }
    .lead-detail h5 { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 1.4rem 0 0.6rem; font-weight: 500; }
    .leads-cards { display: none; }

      .leads-table { display: none; }
      .leads-cards { display: grid; gap: 0.8rem; }

      .lead-card .acts { display: flex; gap: 0.5rem; margin-top: 0.6rem; align-items: center; }
      .lead-detail dl { grid-template-columns: 1fr; }
    }

    .editor-pick__actions a { text-decoration: none; display: inline-flex; align-items: center; }

  // ============================================================
  // Theme
  // ============================================================
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    localStorage.setItem('cms.theme', t);
    const isLight = t === 'light';
    document.getElementById('theme-icon-sun').style.display  = isLight ? 'none' : '';
    document.getElementById('theme-icon-moon').style.display = isLight ? '' : 'none';
    document.getElementById('theme-label').textContent = isLight ? 'Tryb ciemny' : 'Tryb jasny';
  }
  function toggleTheme() {
    applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  }
  applyTheme(localStorage.getItem('cms.theme') || 'dark');
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

  // ============================================================
  // State
  // ============================================================
  let auth = null;
  let strings = [], media = [], blocks = [];
  let currentTab = null;

  // ============================================================
  // Auth
  // ============================================================
  function saveAuth(a) { auth = a; localStorage.setItem('cms.auth', JSON.stringify(a)); }
  function loadAuth() {
    try { const raw = localStorage.getItem('cms.auth'); if (!raw) return null; const a = JSON.parse(raw); return (a && a.access_token) ? a : null; }
    catch (_) { return null; }
  }
  function clearAuth() { auth = null; localStorage.removeItem('cms.auth'); }
  function authHeaders(extra) {
    return Object.assign({
      apikey: SUPABASE_KEY,
      Authorization: 'Bearer ' + (auth ? auth.access_token : SUPABASE_KEY)
    }, extra || {});
  }

  // ============================================================
  // API
  // ============================================================
  async function apiFetch(path, opts) {
    opts = opts || {};
    const headers = authHeaders(opts.headers);
    if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof Blob) && !(opts.body instanceof FormData)) {
      headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    if (opts.prefer) headers['Prefer'] = opts.prefer;
    const url = path.startsWith('http') ? path : (SUPABASE_URL + path);
    const r = await fetch(url, Object.assign({}, opts, { headers }));
    if (!r.ok) {
      let msg = 'HTTP ' + r.status;
      try { const j = await r.json(); msg = j.message || j.error_description || j.error || msg; } catch(_){}
      throw new Error(msg);
    }
    const ct = r.headers.get('content-type') || '';
    return ct.indexOf('json') >= 0 ? r.json() : null;
  }

  async function loginRequest(email, password) {
    return apiFetch('/auth/v1/token?grant_type=password', { method: 'POST', body: { email, password } });
  }

  async function loadAll() {
    const [s, m, b] = await Promise.all([
      apiFetch('/rest/v1/cms_strings?select=key,value,page,label,kind,sort_index&order=page.asc,sort_index.asc,key.asc'),
      apiFetch('/rest/v1/cms_media?select=key,url,page,label,alt,sort_index&order=page.asc,sort_index.asc,key.asc'),
      apiFetch('/rest/v1/cms_blocks?select=id,page,region,type,data,order_index,visible&order=region.asc,order_index.asc')
    ]);
    strings = s; media = m; blocks = b;
  }

  async function updateString(key, value) {
    return apiFetch('/rest/v1/cms_strings?key=eq.' + encodeURIComponent(key), {
      method: 'PATCH', prefer: 'return=minimal',
      body: { value: value, updated_at: new Date().toISOString(), updated_by: auth.user.id }
    });
  }
  async function updateMediaUrl(key, url) {
    return apiFetch('/rest/v1/cms_media?key=eq.' + encodeURIComponent(key), {
      method: 'PATCH', prefer: 'return=minimal',
      body: { url: url, updated_at: new Date().toISOString(), updated_by: auth.user.id }
    });
  }
  async function upsertBlock(block) {
    if (block.id) {
      return apiFetch('/rest/v1/cms_blocks?id=eq.' + block.id, {
        method: 'PATCH', prefer: 'return=representation',
        body: { page: block.page, region: block.region, type: block.type, data: block.data,
                order_index: block.order_index, visible: block.visible,
                updated_at: new Date().toISOString(), updated_by: auth.user.id }
      });
    }
    return apiFetch('/rest/v1/cms_blocks', {
      method: 'POST', prefer: 'return=representation',
      body: { page: block.page, region: block.region, type: block.type, data: block.data,
              order_index: block.order_index, visible: block.visible !== false, updated_by: auth.user.id }
    });
  }
  async function deleteBlock(id) {
    return apiFetch('/rest/v1/cms_blocks?id=eq.' + id, { method: 'DELETE', prefer: 'return=minimal' });
  }
  async function setBlockVisibility(id, visible) {
    return apiFetch('/rest/v1/cms_blocks?id=eq.' + id, {
      method: 'PATCH', prefer: 'return=minimal',
      body: { visible: visible, updated_at: new Date().toISOString(), updated_by: auth.user.id }
    });
  }
  async function setBlockOrder(id, order_index) {
    return apiFetch('/rest/v1/cms_blocks?id=eq.' + id, {
      method: 'PATCH', prefer: 'return=minimal',
      body: { order_index: order_index, updated_at: new Date().toISOString(), updated_by: auth.user.id }
    });
  }

  async function uploadFile(file) {
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
    const safe = file.name.replace(/\.[^.]+$/,'').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,40) || 'image';
    const path = Date.now() + '_' + safe + '.' + ext;
    const url = SUPABASE_URL + '/storage/v1/object/' + STORAGE_BUCKET + '/' + encodeURIComponent(path);
    const r = await fetch(url, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': file.type || 'application/octet-stream' }),
      body: file
    });
    if (!r.ok) {
      let msg = 'Upload failed ' + r.status;
      try { const j = await r.json(); msg = j.message || msg; } catch(_){}
      throw new Error(msg);
    }
    return SUPABASE_URL + '/storage/v1/object/public/' + STORAGE_BUCKET + '/' + encodeURIComponent(path);
  }

  // ============================================================
  // Toast
  // ============================================================
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg, kind) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show ' + (kind || '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast ' + (kind || ''); }, 2800);
  }

  // ============================================================
  // Login flow
  // ============================================================
  const loginEl = document.getElementById('login');
  const appEl = document.getElementById('app');
  const errEl = document.getElementById('li-err');

  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    errEl.textContent = '';
    const email = document.getElementById('li-email').value.trim();
    const pass = document.getElementById('li-pass').value;
    try {
      const r = await loginRequest(email, pass);
      saveAuth({ access_token: r.access_token, refresh_token: r.refresh_token, user: { id: r.user.id, email: r.user.email } });
      await bootApp();
    } catch (e) {
      errEl.textContent = e.message || String(e);
    }
  });

  document.getElementById('logout').addEventListener('click', function () {
    clearAuth();
    location.reload();
  });

  // ============================================================
  // Boot
  // ============================================================
  async function bootApp() {
    try { await loadAll(); }
    catch (e) {
      if (/JWT|token|401|403/i.test(e.message)) {
        clearAuth();
        toast('Sesja wygasła, zaloguj się ponownie.', 'err');
        setTimeout(function(){ location.reload(); }, 1500);
        return;
      }
      toast('Błąd ładowania: ' + e.message, 'err');
      return;
    }
    loginEl.style.display = 'none';
    appEl.classList.add('ready');
    document.getElementById('who').textContent = auth.user.email;
    document.querySelectorAll('.sidebar .tab').forEach(function (btn) {
      btn.addEventListener('click', function () { activateTab(btn.dataset.tab); });
    });
    activateTab('editor');
    refreshLeadsBadge();

  // ============================================================
  // Render
  // ============================================================
  function activateTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.sidebar .tab').forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    renderPage(tab);
    document.querySelector('.main').scrollTop = 0;
  }

  function renderPage(page) {
    const main = document.getElementById('main');
    main.innerHTML = '';
    if (page === 'editor') { renderEditorPicker(main); return; }

    if (page === 'leads') { renderLeads(main); return; }

    const info = PAGE_INFO[page] || { name: page, desc: '' };
    const head = document.createElement('div'); head.className = 'page-head';
    const file = PAGE_FILE[page];
    const previewLink = file
      ? '<a class="btn-ghost preview-link" href="' + file + '?v=' + Date.now() + '" target="_blank" rel="noopener">Zobacz stronę ↗</a>'
      : '';
    head.innerHTML = '<div class="page-head-row">' +
      '<div><h2>' + escapeHtml(info.name) + '</h2><div class="desc">' + escapeHtml(info.desc) + '</div></div>' +
      previewLink + '</div>';
    main.appendChild(head);

    // ---- STRINGS (grouped) ----
    const pageStrings = strings.filter(function (s) { return s.page === page; });
    if (pageStrings.length) {
      const sec = makeSection('Teksty i linki', 'Klikni w pole, edytuj, wyjdź z pola — zapis jest automatyczny.');
      const grouped = groupStrings(pageStrings);
      grouped.forEach(function (g) {
        const sub = document.createElement('div'); sub.className = 'subgroup';
        const sh = document.createElement('div'); sh.className = 'subgroup-head';
        sh.innerHTML = '<h4>' + escapeHtml(g.label) + '</h4>' + (g.desc ? '<div class="desc">' + escapeHtml(g.desc) + '</div>' : '');
        sub.appendChild(sh);
        g.items.forEach(function (s) { sub.appendChild(renderStringRow(s)); });
        sec.appendChild(sub);
      });
      main.appendChild(sec);
    }

    // ---- MEDIA ----
    const pageMedia = media.filter(function (m) { return m.page === page; });
    if (pageMedia.length) {
      const sec = makeSection('Zdjęcia i logo', 'Kliknij "Wymień" aby załadować nowy plik (JPG, PNG, WebP). Optimalne ~1200–2000 px szerokości.');
      pageMedia.forEach(function (m) { sec.appendChild(renderMediaRow(m)); });
      main.appendChild(sec);
    }

    // ---- BLOCKS ----
    const regions = PAGE_REGIONS[page];
    if (regions && regions.length) {
      const sec = makeSection('Bloki — dodawanie nowych sekcji',
        'Każdy "region" to miejsce na stronie, gdzie możesz dodać dowolny blok (kartę modelu, doradcę, pasek promo, sekcję CTA itp). Bloki dziedziczą styl strony.');
      regions.forEach(function (r) { sec.appendChild(renderRegion(page, r)); });
      main.appendChild(sec);
    }

    if (!pageStrings.length && !pageMedia.length && !(regions && regions.length)) {
      const e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = 'Brak elementów do edycji na tej stronie.';
      main.appendChild(e);
    }
  }

  // ---- Edytor wizualny: wybór strony ----
  const EDITOR_PAGES = [
    { group: 'Strony salonów', items: [
      { file: 'index.html',           name: 'Strona główna',        desc: 'Wybór salonu — logo, etykiety, stopka.' },
      { file: 'mercedes.html',        name: 'Mercedes-Benz',        desc: 'Hero (zdjęcie lub wideo), modele, salon, mapa, stopka.' },

  function renderEditorPicker(main) {
    const head = document.createElement('div'); head.className = 'page-head';
    head.innerHTML = '<div class="page-head-row"><div><h2>Edytuj stronę</h2>' +
      '<div class="desc">Kliknij „Edytuj na stronie” — otworzy się strona z włączonym trybem edycji: klikasz tekst i piszesz, klikasz zdjęcie lub wideo i wymieniasz, „+ Dodaj blok” dodaje nowe sekcje (karty modeli, doradców, media, CTA…). „Zapisz” publikuje od razu na stronie.</div></div></div>';
    main.appendChild(head);
    EDITOR_PAGES.forEach(function (g) {
      const sec = makeSection(g.group, '');
      const grid = document.createElement('div'); grid.className = 'editor-pick';
      g.items.forEach(function (p) {
        const card = document.createElement('div'); card.className = 'editor-pick__card';
        card.innerHTML = '<div class="editor-pick__name">' + escapeHtml(p.name) + '</div>' +
          '<div class="editor-pick__desc">' + escapeHtml(p.desc) + '</div>' +
          '<div class="editor-pick__actions">' +
            '<a class="btn-primary" href="' + p.file + '?edit=1" target="_blank" rel="noopener">Edytuj na stronie ↗</a>' +
            '<a class="btn-ghost" href="' + p.file + '?v=' + Date.now() + '" target="_blank" rel="noopener">Podgląd</a>' +
          '</div>';
        grid.appendChild(card);
      });
      sec.appendChild(grid);
      main.appendChild(sec);
    });

  function makeSection(title, help) {
    const sec = document.createElement('section');
    sec.className = 'section';
    sec.innerHTML = '<h3>' + escapeHtml(title) + '</h3>' + (help ? '<p class="help">' + escapeHtml(help) + '</p>' : '');
    return sec;
  }

  // Group strings into sections (preserves sort_index order within each section)
  function groupStrings(items) {
    const out = [];
    const used = new Set();
    STRING_SECTIONS.forEach(function (S) {
      const matched = items.filter(function (s) { return !used.has(s.key) && S.test(s.key); });
      if (matched.length) {
        matched.forEach(function (s) { used.add(s.key); });
        out.push({ label: S.label, desc: S.desc, items: matched });
      }
    });
    const rest = items.filter(function (s) { return !used.has(s.key); });
    if (rest.length) out.push({ label: 'Inne', desc: '', items: rest });
    return out;
  }

  // ====== String row ======
  function renderStringRow(row) {
    const wrap = document.createElement('div');
    wrap.className = 'field-row';

    const lab = document.createElement('div');
    const KIND_LABEL = { href: 'Link (adres)', url: 'Link (adres)', longtext: 'Dłuższy tekst', html: 'Tekst z formatowaniem' };
    const kindLabel = KIND_LABEL[row.kind];
    lab.innerHTML = '<span class="label-text">' + escapeHtml(row.label || row.key) + '</span>' +
                    (kindLabel ? '<span class="label-key">' + kindLabel + '</span>' : '');

    const ctrl = document.createElement('div'); ctrl.className = 'ctrl';
    const input = (row.kind === 'longtext' || row.kind === 'html')
      ? document.createElement('textarea')
      : document.createElement('input');
    if (input.tagName === 'INPUT') input.type = (row.kind === 'href' || row.kind === 'url') ? 'url' : 'text';
    input.value = row.value || '';

    const state = document.createElement('span'); state.className = 'save-state';
    let saving = false, last = row.value || '';
    async function save() {
      if (saving || input.value === last) return;
      saving = true; state.textContent = 'Zapisuję…'; state.className = 'save-state';
      try {
        await updateString(row.key, input.value);
        last = input.value; row.value = input.value;
        state.textContent = '✓ Zapisano'; state.className = 'save-state ok';
        setTimeout(function () { if (state.textContent === '✓ Zapisano') state.textContent = ''; }, 2200);
      } catch (e) { state.textContent = 'Błąd: ' + e.message; state.className = 'save-state err'; }
      finally { saving = false; }
    }
    input.addEventListener('blur', save);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && input.tagName === 'INPUT') { e.preventDefault(); input.blur(); } });
    ctrl.appendChild(input);
    ctrl.appendChild(state);

    wrap.appendChild(lab);
    wrap.appendChild(ctrl);
    return wrap;
  }

  // ====== Media row ======
  function renderMediaRow(row) {
    const wrap = document.createElement('div'); wrap.className = 'media-row';

    const thumb = document.createElement('div'); thumb.className = 'media-thumb';
    if (row.url) {
      const img = document.createElement('img');
      img.src = row.url; img.alt = row.alt || row.label || row.key;
      img.onerror = function () { thumb.innerHTML = '<span class="empty">brak</span>'; };
      thumb.appendChild(img);
    } else { thumb.innerHTML = '<span class="empty">brak</span>'; }

    const info = document.createElement('div'); info.className = 'media-info';
    info.innerHTML = '<div class="label-text">Zdjęcie</div>' +
                     '<div class="name">' + escapeHtml(row.label || row.key) + '</div>' +
                     '<div class="url">' + escapeHtml(row.url || '') + '</div>';

    const right = document.createElement('div'); right.className = 'right';
    const state = document.createElement('span'); state.className = 'save-state';
    const btn = document.createElement('button'); btn.className = 'btn-primary'; btn.textContent = 'Wymień';
    const fileInput = document.createElement('input'); fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.style.display = 'none';

    btn.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', async function () {
      const f = fileInput.files && fileInput.files[0]; if (!f) return;
      state.textContent = 'Wgrywam…'; state.className = 'save-state';
      try {
        const url = await uploadFile(f);
        await updateMediaUrl(row.key, url);
        row.url = url;
        info.querySelector('.url').textContent = url;
        thumb.innerHTML = ''; const img = document.createElement('img'); img.src = url; thumb.appendChild(img);
        state.textContent = '✓ Zapisano'; state.className = 'save-state ok';
        setTimeout(function () { if (state.textContent === '✓ Zapisano') state.textContent = ''; }, 2200);
      } catch (e) { state.textContent = 'Błąd: ' + e.message; state.className = 'save-state err'; }
      fileInput.value = '';
    });

    right.appendChild(state); right.appendChild(btn); right.appendChild(fileInput);

    wrap.appendChild(thumb); wrap.appendChild(info); wrap.appendChild(right);
    return wrap;
  }

  // ====== Region / blocks ======
  function renderRegion(page, region) {
    const wrap = document.createElement('div'); wrap.className = 'region';

    const head = document.createElement('div'); head.className = 'region-head';
    const meta = REGION_LABELS[region] || { name: region, desc: '' };
    const left = document.createElement('div');
    left.innerHTML = '<h4>' + escapeHtml(meta.name) + '</h4><div class="desc">' + escapeHtml(meta.desc) + '</div>';
    const addBtn = document.createElement('button'); addBtn.className = 'btn-primary'; addBtn.textContent = '+ Dodaj blok';
    addBtn.addEventListener('click', function () { openTypePicker(page, region); });
    head.appendChild(left); head.appendChild(addBtn);
    wrap.appendChild(head);

    const regionBlocks = blocks.filter(function (b) { return b.region === region; })
      .sort(function (a, b) { return a.order_index - b.order_index; });

    if (!regionBlocks.length) {
      const e = document.createElement('div'); e.className = 'empty-state';
      e.textContent = 'Brak bloków. Kliknij "+ Dodaj blok" by zacząć.';
      wrap.appendChild(e);
    } else {
      regionBlocks.forEach(function (b) { wrap.appendChild(renderBlockCard(b)); });
    }
    return wrap;
  }

  function renderBlockCard(b) {
    const wrap = document.createElement('div'); wrap.className = 'block-card';

    const order = document.createElement('div'); order.className = 'order';
    const orderIn = document.createElement('input'); orderIn.type = 'number'; orderIn.step = '0.5'; orderIn.value = b.order_index;
    orderIn.title = 'Kolejność na stronie (mniejsza liczba = wyżej)';
    orderIn.addEventListener('change', async function () {
      try {
        const v = parseFloat(orderIn.value);
        await setBlockOrder(b.id, v); b.order_index = v;
        toast('Kolejność zapisana', 'ok');
        renderPage(currentTab);
      } catch (e) { toast('Błąd: ' + e.message, 'err'); orderIn.value = b.order_index; }
    });
    order.appendChild(orderIn);

    const summary = document.createElement('div'); summary.className = 'summary';
    const chip = document.createElement('span'); chip.className = 'type-chip';
    chip.textContent = (BLOCK_SCHEMA[b.type] && BLOCK_SCHEMA[b.type].label) || b.type;
    summary.appendChild(chip);
    summary.appendChild(document.createTextNode(blockSummary(b)));

    const vis = document.createElement('button');
    vis.className = 'visible-toggle' + (b.visible ? '' : ' hidden');
    vis.textContent = b.visible ? '● Widoczny' : '○ Ukryty';
    vis.title = b.visible ? 'Kliknij aby ukryć (zostaje w bazie, ale nie widać na stronie)' : 'Kliknij aby przywrócić';
    vis.addEventListener('click', async function () {
      try {
        await setBlockVisibility(b.id, !b.visible); b.visible = !b.visible;
        renderPage(currentTab); toast(b.visible ? 'Pokazano' : 'Ukryto', 'ok');
      } catch (e) { toast('Błąd: ' + e.message, 'err'); }
    });

    const editBtn = document.createElement('button'); editBtn.className = 'edit-btn'; editBtn.textContent = 'Edytuj';
    editBtn.addEventListener('click', function () { openBlockEditor(b); });

    const delBtn = document.createElement('button'); delBtn.className = 'btn-danger'; delBtn.textContent = 'Usuń';
    delBtn.addEventListener('click', async function () {
      if (!confirm('Usunąć ten blok?\n\nHistoria zostaje w bazie, ale w panelu nie zobaczysz go więcej.')) return;
      try {
        await deleteBlock(b.id);
        blocks = blocks.filter(function (x) { return x.id !== b.id; });
        renderPage(currentTab); toast('Usunięto', 'ok');
      } catch (e) { toast('Błąd: ' + e.message, 'err'); }
    });

    wrap.appendChild(order);
    wrap.appendChild(summary);
    wrap.appendChild(vis);
    wrap.appendChild(editBtn);
    wrap.appendChild(delBtn);
    return wrap;
  }

  function blockSummary(b) {
    const d = b.data || {};
    if (b.type === 'model_card')    return d.name || '(bez nazwy)';
    if (b.type === 'team_member')   return d.name || '(bez nazwy)';
    if (b.type === 'promo_strip')   return (d.text || '').slice(0, 70);
    if (b.type === 'quote_ribbon')  return (d.text || '').slice(0, 70);
    if (b.type === 'cta_section')   return (d.title || '') + ' ' + (d.title_bold || '');
    if (b.type === 'text_section')  return (d.title || d.eyebrow || '').slice(0, 70);
    if (b.type === 'feature_split') return (d.title || d.eyebrow || '').slice(0, 70);
    if (b.type === 'image_full')    return d.caption || '(zdjęcie)';
    return '';
  }

  // ====== Type picker modal ======
  function openTypePicker(page, region) {
    const ov = document.getElementById('modal-overlay');
    document.getElementById('modal-eyebrow').textContent = 'Nowy blok';
    document.getElementById('modal-title').textContent = 'Wybierz typ bloku';
    const meta = REGION_LABELS[region] || { name: region, desc: '' };
    document.getElementById('modal-desc').textContent = 'Region: ' + meta.name + (meta.desc ? ' · ' + meta.desc : '');
    const body = document.getElementById('modal-body'); body.innerHTML = '';
    const foot = document.getElementById('modal-foot'); foot.innerHTML = '';

    const grid = document.createElement('div'); grid.className = 'type-picker';
    Object.keys(BLOCK_SCHEMA).forEach(function (type) {
      const meta = BLOCK_SCHEMA[type];
      const allowed = meta.universal
        ? !['mercedes.models','zespol-mercedes.team-list','zespol-maybach.team-list'].includes(region)
        : (meta.regions || []).indexOf(region) >= 0;
      if (!allowed) return;
      const btn = document.createElement('button');
      btn.innerHTML = '<b>' + escapeHtml(meta.label) + '</b><span>' + escapeHtml(meta.desc) + '</span>';
      btn.addEventListener('click', function () {
        closeModal();
        openBlockEditor({ page: page, region: region, type: type, data: {}, order_index: nextOrderIndex(region), visible: true });
      });
      grid.appendChild(btn);
    });
    if (!grid.children.length) {
      grid.innerHTML = '<div class="empty-state">Brak dostępnych typów dla tego regionu.</div>';
    }
    body.appendChild(grid);
    const cancel = document.createElement('button'); cancel.className = 'btn-ghost'; cancel.textContent = 'Anuluj';
    cancel.addEventListener('click', closeModal);
    foot.appendChild(cancel);
    ov.classList.add('open');
  }

  function nextOrderIndex(region) {
    const rb = blocks.filter(function (b) { return b.region === region; });
    if (!rb.length) return 1;
    return Math.max.apply(null, rb.map(function (b) { return b.order_index; })) + 1;
  }

  // ====== Block editor modal ======
  function openBlockEditor(b) {
    const isNew = !b.id;
    const schema = BLOCK_SCHEMA[b.type];
    const ov = document.getElementById('modal-overlay');
    const regionMeta = REGION_LABELS[b.region] || { name: b.region, desc: '' };

    document.getElementById('modal-eyebrow').textContent = isNew ? 'Nowy blok' : 'Edycja bloku';
    document.getElementById('modal-title').textContent = schema ? schema.label : b.type;
    document.getElementById('modal-desc').textContent =
      (schema ? schema.desc + ' · ' : '') + 'Region: ' + regionMeta.name;

    const body = document.getElementById('modal-body'); body.innerHTML = '';
    const foot = document.getElementById('modal-foot'); foot.innerHTML = '';
    const draft = Object.assign({}, b.data || {});

    schema.fields.forEach(function (f) {
      const wrap = document.createElement('div'); wrap.className = 'modal-field';
      const lbl = document.createElement('label'); lbl.textContent = f.label;
      wrap.appendChild(lbl);

      if (f.kind === 'image' || f.kind === 'media') {
        const isMedia = f.kind === 'media';
        const row = document.createElement('div'); row.className = 'upload-img';
        const prev = document.createElement('div'); prev.className = 'preview';
        const setPreview = function (u) { prev.innerHTML = ''; if (!u) return; if (isMedia && /\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(u)) { const v = document.createElement('video'); v.src = u; v.muted = true; v.playsInline = true; v.style.maxWidth = '100%'; prev.appendChild(v); } else if (isMedia && /(youtube\.com|youtu\.be|vimeo\.com)\//i.test(u)) { const t = document.createElement('div'); t.textContent = '▶ ' + u; t.style.fontSize = '0.8rem'; prev.appendChild(t); } else { const i = document.createElement('img'); i.src = u; prev.appendChild(i); } };
        setPreview(draft[f.key]);
        const urlIn = document.createElement('input'); urlIn.type = 'url'; urlIn.value = draft[f.key] || ''; urlIn.placeholder = isMedia ? 'URL zdjęcia / wideo / YouTube lub wgraj plik →' : 'URL zdjęcia lub wgraj plik →';
        const btn = document.createElement('button'); btn.textContent = 'Wgraj plik'; btn.type = 'button'; btn.className = 'btn-primary';
        const fileIn = document.createElement('input'); fileIn.type = 'file'; fileIn.accept = isMedia ? 'image/*,video/mp4,video/webm,video/quicktime' : 'image/*'; fileIn.style.display = 'none';
        btn.addEventListener('click', function () { fileIn.click(); });
        fileIn.addEventListener('change', async function () {
          const f2 = fileIn.files && fileIn.files[0]; if (!f2) return;
          btn.textContent = 'Wgrywam…'; btn.disabled = true;
          try {
            const url = await uploadFile(f2);
            urlIn.value = url; draft[f.key] = url;
            setPreview(url);
            toast('Wgrane', 'ok');
          } catch (e) { toast('Błąd: ' + e.message, 'err'); }
          btn.textContent = 'Wgraj plik'; btn.disabled = false; fileIn.value = '';
        });
        urlIn.addEventListener('input', function () { draft[f.key] = urlIn.value; setPreview(urlIn.value); });
        row.appendChild(prev); row.appendChild(urlIn); row.appendChild(btn); row.appendChild(fileIn);
        wrap.appendChild(row);
      } else if (f.kind === 'longtext' || f.kind === 'lines') {
        const ta = document.createElement('textarea');
        ta.value = f.kind === 'lines'
          ? (Array.isArray(draft[f.key]) ? draft[f.key].join('\n') : (draft[f.key] || ''))
          : (draft[f.key] || '');
        ta.addEventListener('input', function () {
          if (f.kind === 'lines') draft[f.key] = ta.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
          else draft[f.key] = ta.value;
        });
        wrap.appendChild(ta);
      } else if (f.kind === 'select') {
        const sel = document.createElement('select');
        f.options.forEach(function (opt) {
          const o = document.createElement('option'); o.value = opt[0]; o.textContent = opt[1];
          sel.appendChild(o);
        });
        sel.value = draft[f.key] || f.default || f.options[0][0];
        draft[f.key] = sel.value;
        sel.addEventListener('change', function () { draft[f.key] = sel.value; });
        wrap.appendChild(sel);
      } else {
        const inp = document.createElement('input');
        inp.type = (f.kind === 'url') ? 'url' : 'text';
        inp.value = draft[f.key] || '';
        inp.addEventListener('input', function () { draft[f.key] = inp.value; });
        wrap.appendChild(inp);
      }
      if (f.hint) {
        const h = document.createElement('small'); h.className = 'hint'; h.textContent = f.hint;
        wrap.appendChild(h);
      }
      body.appendChild(wrap);
    });

    const cancel = document.createElement('button'); cancel.className = 'btn-ghost'; cancel.textContent = 'Anuluj';
    cancel.addEventListener('click', closeModal);
    const save = document.createElement('button'); save.className = 'btn-primary'; save.textContent = isNew ? 'Dodaj blok' : 'Zapisz zmiany';
    save.addEventListener('click', async function () {
      save.disabled = true; save.textContent = 'Zapisuję…';
      try {
        const payload = Object.assign({}, b, { data: draft });
        const res = await upsertBlock(payload);
        const saved = Array.isArray(res) ? res[0] : res;
        if (isNew) {
          if (saved && saved.id) blocks.push(saved);
        } else {
          const idx = blocks.findIndex(function (x) { return x.id === b.id; });
          if (idx >= 0 && saved) blocks[idx] = saved;
        }
        closeModal();
        renderPage(currentTab);
        toast(isNew ? 'Dodano blok' : 'Zapisano', 'ok');
      } catch (e) { toast('Błąd: ' + e.message, 'err'); save.disabled = false; save.textContent = isNew ? 'Dodaj blok' : 'Zapisz zmiany'; }
    });
    foot.appendChild(cancel); foot.appendChild(save);
    ov.classList.add('open');
  }

  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', function (e) {
    if (e.target.id === 'modal-overlay') closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  // ============================================================
  // Init
  // ============================================================
  (function init() {
    const a = loadAuth();
    if (a) { auth = a; bootApp(); }
  })();

  // ============================================================
  // Zgłoszenia z formularza (cms_leads)
  // ============================================================
  const LEAD_STATUS = { new: 'Nowe', in_progress: 'W toku', closed: 'Zamknięte' };
  let leadsCache = [];
  let leadsFilter = 'all';
  let leadsQuery = '';

  async function refreshLeadsBadge() {
    try {
      const rows = await apiFetch('/rest/v1/cms_leads?select=id&status=eq.new');
      const badge = document.getElementById('leads-badge');
      if (!badge) return;
      const n = (rows || []).length;
      badge.textContent = n;
      badge.hidden = n === 0;
    } catch (_) { /* brak uprawnień / tabela nieosiągalna — cicho */ }
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fmtDay(s) {
    if (!s) return '—';
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    return m ? (m[3] + '.' + m[2] + '.' + m[1]) : s;
  }

  function leadMatches(l) {
    if (leadsFilter === 'new' || leadsFilter === 'in_progress' || leadsFilter === 'closed') {
      if (l.status !== leadsFilter) return false;
    } else if (leadsFilter === 'mercedes' || leadsFilter === 'maybach') {
      if (l.brand !== leadsFilter) return false;
    }
    if (leadsQuery) {
      const q = leadsQuery.toLowerCase();
      const hay = [l.name, l.phone, l.email, l.model].filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }

  async function renderLeads(main) {
    const head = document.createElement('div'); head.className = 'page-head';
    head.innerHTML = '<div class="page-head-row"><div><h2>Zgłoszenia z formularza</h2>' +
      '<div class="desc">Zgłoszenia z okna „Umów wizytę” na stronach Mercedes-Benz i Mercedes-Maybach. Każde zgłoszenie zawiera zapis dokładnej treści zgód, które klient zaznaczył.</div></div>' +
      '<button class="btn-ghost" id="leads-reload">Odśwież</button></div>';
    main.appendChild(head);

    const sec = makeSection('Lista zgłoszeń', '');
    sec.querySelector('.help') && sec.querySelector('.help').remove();
    const body = document.createElement('div'); body.id = 'leads-body';
    body.innerHTML = '<div class="leads-empty">Ładowanie…</div>';
    sec.appendChild(body);
    main.appendChild(sec);

    head.querySelector('#leads-reload').addEventListener('click', function () { loadLeads(body); });
    loadLeads(body);
  }

  async function loadLeads(body) {
    try {
      leadsCache = await apiFetch('/rest/v1/cms_leads?select=*&order=created_at.desc&limit=500') || [];
    } catch (e) {
      body.innerHTML = '<div class="leads-empty">Błąd ładowania zgłoszeń: ' + escapeHtml(e.message) + '</div>';
      return;
    }
    refreshLeadsBadge();
    drawLeads(body);
  }

  function drawLeads(body) {
    body.innerHTML = '';
    const all = leadsCache;
    const cnt = { new: 0, in_progress: 0, closed: 0 };
    all.forEach(function (l) { if (cnt[l.status] !== undefined) cnt[l.status]++; });

    const stats = document.createElement('div'); stats.className = 'leads-stats';
    stats.innerHTML = '<div class="leads-stat"><b>' + cnt.new + '</b>Nowe</div>' +
      '<div class="leads-stat"><b>' + cnt.in_progress + '</b>W toku</div>' +
      '<div class="leads-stat"><b>' + cnt.closed + '</b>Zamknięte</div>' +
      '<div class="leads-stat"><b>' + all.length + '</b>Razem</div>';
    body.appendChild(stats);

    const bar = document.createElement('div'); bar.className = 'leads-toolbar';
    [['all','Wszystkie'],['new','Nowe'],['in_progress','W toku'],['closed','Zamknięte'],['mercedes','Mercedes'],['maybach','Maybach']].forEach(function (f) {
      const b = document.createElement('button');
      b.className = 'leads-chip' + (leadsFilter === f[0] ? ' active' : '');
      b.textContent = f[1];
      b.addEventListener('click', function () { leadsFilter = f[0]; drawLeads(body); });
      bar.appendChild(b);
    });
    const search = document.createElement('input');
    search.type = 'search'; search.placeholder = 'Szukaj: imię, telefon, e-mail…'; search.value = leadsQuery;
    search.addEventListener('input', function () { leadsQuery = search.value.trim(); drawList(); });
    bar.appendChild(search);
    const sp = document.createElement('span'); sp.className = 'spacer'; bar.appendChild(sp);
    const csv = document.createElement('button'); csv.className = 'btn-ghost'; csv.textContent = 'Eksport CSV';
    csv.addEventListener('click', function () { exportLeadsCsv(all.filter(leadMatches)); });
    bar.appendChild(csv);
    body.appendChild(bar);

    const listWrap = document.createElement('div');
    body.appendChild(listWrap);

    function drawList() {
      const rows = all.filter(leadMatches);
      listWrap.innerHTML = '';
      if (!rows.length) {
        listWrap.innerHTML = '<div class="leads-empty">Brak zgłoszeń dla wybranego filtra.</div>';
        return;
      }
      // ---- table (desktop)
      const table = document.createElement('table'); table.className = 'leads-table';
      table.innerHTML = '<thead><tr><th>Data</th><th>Marka</th><th>Imię i nazwisko</th><th>Telefon</th><th>E-mail</th><th>Model</th><th>Termin</th><th>Status</th><th></th></tr></thead>';
      const tb = document.createElement('tbody');
      rows.forEach(function (l) {
        const tr = document.createElement('tr'); tr.className = 'lead-status--' + l.status;
        tr.innerHTML =
          '<td class="nowrap">' + escapeHtml(fmtDate(l.created_at)) + '</td>' +
          '<td>' + brandBadge(l.brand) + '</td>' +
          '<td>' + escapeHtml(l.name || '') + (l.message ? ' <span class="muted" title="Wiadomość">✎</span>' : '') + '</td>' +
          '<td class="nowrap"><a href="tel:' + escapeHtml((l.phone || '').replace(/\s+/g, '')) + '">' + escapeHtml(l.phone || '') + '</a></td>' +
          '<td>' + (l.email ? '<a href="mailto:' + escapeHtml(l.email) + '">' + escapeHtml(l.email) + '</a>' : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (l.model ? escapeHtml(l.model) : '<span class="muted">—</span>') + '</td>' +
          '<td class="nowrap">' + escapeHtml(fmtDay(l.preferred_date)) + '</td>' +
          '<td></td><td class="nowrap"></td>';
        tr.children[7].appendChild(statusSelect(l, function () { drawLeads(body); }));
        const det = document.createElement('button'); det.className = 'btn-ghost'; det.textContent = 'Szczegóły';
        det.addEventListener('click', function () { openLeadDetail(l, function () { drawLeads(body); }); });
        tr.children[8].appendChild(det);
        tb.appendChild(tr);
      });
      table.appendChild(tb);
      listWrap.appendChild(table);

      // ---- cards (mobile)
      const cards = document.createElement('div'); cards.className = 'leads-cards';
      rows.forEach(function (l) {
        const c = document.createElement('div'); c.className = 'lead-card';
        c.innerHTML =
          '<div class="row"><span class="name">' + escapeHtml(l.name || '') + '</span>' + brandBadge(l.brand) + '</div>' +
          '<div class="row"><span class="muted">' + escapeHtml(fmtDate(l.created_at)) + '</span><span>' + escapeHtml(fmtDay(l.preferred_date)) + '</span></div>' +
          '<div><a href="tel:' + escapeHtml((l.phone || '').replace(/\s+/g, '')) + '">' + escapeHtml(l.phone || '') + '</a>' +
          (l.email ? ' · <a href="mailto:' + escapeHtml(l.email) + '">' + escapeHtml(l.email) + '</a>' : '') + '</div>' +
          (l.model ? '<div class="muted">' + escapeHtml(l.model) + '</div>' : '') +
          '<div class="acts"></div>';
        const acts = c.querySelector('.acts');
        acts.appendChild(statusSelect(l, function () { drawLeads(body); }));
        const det = document.createElement('button'); det.className = 'btn-ghost'; det.textContent = 'Szczegóły';
        det.addEventListener('click', function () { openLeadDetail(l, function () { drawLeads(body); }); });
        acts.appendChild(det);
        cards.appendChild(c);
      });
      listWrap.appendChild(cards);
    }
    drawList();
  }

  function brandBadge(brand) {
    return brand === 'maybach'
      ? '<span class="lead-brand lead-brand--maybach">Maybach</span>'
      : '<span class="lead-brand">MB</span>';
  }

  function statusSelect(lead, onChange) {
    const sel = document.createElement('select');
    Object.keys(LEAD_STATUS).forEach(function (k) {
      const o = document.createElement('option'); o.value = k; o.textContent = LEAD_STATUS[k];
      if (lead.status === k) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', async function () {
      const prev = lead.status;
      sel.disabled = true;
      try {
        await patchLead(lead.id, { status: sel.value });
        lead.status = sel.value;
        toast('Status: ' + LEAD_STATUS[sel.value]);
        refreshLeadsBadge();
        if (onChange) onChange();
      } catch (e) {
        sel.value = prev;
        toast('Błąd zapisu: ' + e.message, 'err');
      } finally { sel.disabled = false; }
    });
    return sel;
  }

  async function patchLead(id, fields) {
    return apiFetch('/rest/v1/cms_leads?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH', prefer: 'return=minimal',
      body: Object.assign({ updated_at: new Date().toISOString(), updated_by: auth.user.id }, fields)
    });
  }

  function openLeadDetail(l, onChange) {
    const ov = document.getElementById('modal-overlay');
    document.getElementById('modal-eyebrow').textContent = 'Zgłoszenie';
    document.getElementById('modal-title').textContent = l.name || '';
    document.getElementById('modal-desc').textContent = fmtDate(l.created_at) + ' · ' + (l.brand === 'maybach' ? 'Mercedes-Maybach' : 'Mercedes-Benz') + ' · strona: ' + (l.page || '—');

    const foot = document.getElementById('modal-foot'); foot.innerHTML = '';

    const wrap = document.createElement('div'); wrap.className = 'lead-detail';
    const t = l.consent_texts || {};
    const consentRow = function (ok, wording) {
      return '<div class="consent-row"><span class="mark' + (ok ? '' : ' no') + '">' + (ok ? '✓' : '—') + '</span><span class="wording">' + escapeHtml(wording || '') + '</span></div>';
    };
    wrap.innerHTML =
      '<dl>' +
      '<dt>Telefon</dt><dd><a href="tel:' + escapeHtml((l.phone || '').replace(/\s+/g, '')) + '">' + escapeHtml(l.phone || '') + '</a></dd>' +
      '<dt>E-mail</dt><dd>' + (l.email ? '<a href="mailto:' + escapeHtml(l.email) + '">' + escapeHtml(l.email) + '</a>' : '—') + '</dd>' +
      '<dt>Model</dt><dd>' + escapeHtml(l.model || '—') + '</dd>' +
      '<dt>Preferowany termin</dt><dd>' + escapeHtml(fmtDay(l.preferred_date)) + '</dd>' +
      '<dt>Wiadomość</dt><dd>' + (l.message ? escapeHtml(l.message).replace(/\n/g, '<br>') : '—') + '</dd>' +
      '<dt>Status</dt><dd id="lead-status-slot"></dd>' +
      '</dl>' +
      '<h5>Zgody (treść w chwili wysłania)</h5>' +
      consentRow(l.consent_privacy, t.consent_privacy || 'Zapoznanie z informacją o przetwarzaniu danych') +
      consentRow(l.consent_marketing_email, t.consent_marketing_email || 'Marketing e-mail') +
      consentRow(l.consent_marketing_phone, t.consent_marketing_phone || 'Marketing telefon / SMS') +
      (t.rodo_info ? '<details style="margin-top:.6rem;font-size:.8rem;color:var(--muted)"><summary>Informacja RODO pokazana klientowi</summary><div style="margin-top:.4rem;line-height:1.5">' + escapeHtml(t.rodo_info) + '</div></details>' : '') +
      '<h5>Notatka</h5>' +
      '<textarea id="lead-note" placeholder="Notatka wewnętrzna (nie widoczna dla klienta)…">' + escapeHtml(l.note || '') + '</textarea>' +
      '<h5>Techniczne</h5>' +
      '<dl><dt>Źródło</dt><dd>' + (l.source_url ? '<a href="' + escapeHtml(l.source_url) + '" target="_blank" rel="noopener">' + escapeHtml(l.source_url) + '</a>' : '—') + '</dd>' +
      '<dt>Przeglądarka</dt><dd style="font-size:.78rem;color:var(--muted)">' + escapeHtml(l.user_agent || '—') + '</dd>' +
      '<dt>ID</dt><dd style="font-size:.78rem;color:var(--muted)">' + escapeHtml(l.id) + '</dd></dl>';
    body.appendChild(wrap);
    wrap.querySelector('#lead-status-slot').appendChild(statusSelect(l, onChange));

    const save = document.createElement('button'); save.className = 'btn-primary'; save.textContent = 'Zapisz notatkę';
    save.addEventListener('click', async function () {
      save.disabled = true;
      try {
        const note = wrap.querySelector('#lead-note').value;
        await patchLead(l.id, { note: note });
        l.note = note;
        toast('Notatka zapisana');
      } catch (e) { toast('Błąd zapisu: ' + e.message, 'err'); }
      finally { save.disabled = false; }
    });
    const close = document.createElement('button'); close.className = 'btn-ghost'; close.textContent = 'Zamknij';
    close.addEventListener('click', closeModal);
    foot.appendChild(close); foot.appendChild(save);
    ov.classList.add('open');
  }

  function exportLeadsCsv(rows) {
    const cols = [
      ['created_at', 'Data', function (l) { return fmtDate(l.created_at); }],
      ['brand', 'Marka', function (l) { return l.brand === 'maybach' ? 'Mercedes-Maybach' : 'Mercedes-Benz'; }],
      ['page', 'Strona', function (l) { return l.page || ''; }],
      ['name', 'Imię i nazwisko', function (l) { return l.name || ''; }],
      ['phone', 'Telefon', function (l) { return l.phone || ''; }],
      ['email', 'E-mail', function (l) { return l.email || ''; }],
      ['model', 'Model', function (l) { return l.model || ''; }],
      ['preferred_date', 'Termin', function (l) { return fmtDay(l.preferred_date); }],
      ['message', 'Wiadomość', function (l) { return l.message || ''; }],
      ['status', 'Status', function (l) { return LEAD_STATUS[l.status] || l.status; }],
      ['consent_privacy', 'Zgoda RODO', function (l) { return l.consent_privacy ? 'TAK' : 'NIE'; }],
      ['consent_marketing_email', 'Marketing e-mail', function (l) { return l.consent_marketing_email ? 'TAK' : 'NIE'; }],
      ['consent_marketing_phone', 'Marketing telefon', function (l) { return l.consent_marketing_phone ? 'TAK' : 'NIE'; }],
      ['note', 'Notatka', function (l) { return l.note || ''; }],
      ['source_url', 'Źródło', function (l) { return l.source_url || ''; }]
    ];
    const esc = function (v) { v = String(v == null ? '' : v); return '"' + v.replace(/"/g, '""') + '"'; };
    const lines = [cols.map(function (c) { return esc(c[1]); }).join(';')];
    rows.forEach(function (l) { lines.push(cols.map(function (c) { return esc(c[2](l)); }).join(';')); });
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = new Date(); const p = function (n) { return (n < 10 ? '0' : '') + n; };
    a.download = 'zgloszenia-autoforum-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Wyeksportowano ' + rows.length + ' zgłoszeń');
  }
  </script>
</body>
